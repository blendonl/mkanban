# Example: Stale Task Watcher
# This action moves tasks from in-progress back to to-do if they've been inactive for 48 hours

id: action-wat-stale-tasks-20241020
type: watcher
name: "Stale task watcher"
description: "Automatically moves inactive in-progress tasks back to to-do after 48 hours"
enabled: true
created_at: "2024-10-20T10:00:00"
modified_at: "2024-10-20T10:00:00"

# Global scope - applies to all boards
scope:
  type: global
  target_id: null

# Check for inactivity every hour
triggers:
  - type: inactivity
    check_interval: 3600  # 1 hour
    inactive_duration: 172800  # 48 hours

# Only apply to tasks in in-progress column that are not git-managed
conditions:
  - type: task_in_column
    column_ids: ["in-progress"]
  - type: task_property
    field: is_git_managed
    operator: equals
    value: false

# Move task to to-do and notify
actions:
  - type: move_task
    target_column: "to-do"
  - type: notify
    message: "Task '{task_title}' was moved back to to-do due to 48 hours of inactivity"
    title: "MKanban - Stale Task"
    platforms: ["desktop"]
    channels: ["system"]
    priority: low

recurrence: null
snooze: null

execution:
  last_triggered: null
  last_success: null
  last_failure: null
  last_error: null
  total_executions: 0
  successful_executions: 0
  consecutive_failures: 0

metadata:
  priority: 2
  max_retries: 3
  retry_delay: 300
  timeout: 30
  tags: ["automation", "cleanup", "productivity"]
  custom: {}

on_success: []
on_failure: []
