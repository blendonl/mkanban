[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mkanban"
version = "0.2.6"
description = "A Terminal User Interface Kanban Board"
authors = [{name = "blendonl", email = "blendonluta@gmail.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "textual>=0.41.0",
    "pydantic>=2.0.0",
    "python-frontmatter>=1.0.0",
    "click>=8.0.0",
    "linkify-it-py>=2.0.0",
    "aiohttp>=3.8.0",
    "python-dotenv>=1.0.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/blendonl/mkanban"
Repository = "https://github.com/blendonl/mkanban"

[project.scripts]
mkanban = "src.main:main"
mkanban-daemon = "src.scripts.mkanban_daemon:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = true

[tool.setuptools.package-data]
"src.ui" = ["*.css"]
